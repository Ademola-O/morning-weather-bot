# .github/workflows/weather.yml
# Tells GitHub to run weather.js every morning and save the result
# back into the repo.

# The name shown in the Actions tab on GitHub.
name: Morning weather

# WHEN should this run? (the triggers)
on:
  schedule:
    - cron: "17 5 * * *"   # every day at around 05:17 UTC so even if delayed by gitHub, will still be a morning report. 
  workflow_dispatch:       # lets you run it manually

# WHAT is the job allowed to do?
# "contents: write" lets it push changes back to this repo.
# Without it, the final push step would be refused.
permissions:
  contents: write

# WHAT should it do? A workflow is made of one or more jobs.
jobs:
  report:
    runs-on: ubuntu-latest
    # The steps run in order. If any step fails, the run stops and
    # GitHub shows a red cross.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node weather.js
      - name: Commit result
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.md
          git commit -m "Update weather" || echo "No changes"
          # Pull in anything pushed since this run started, then re-apply
          # our commit on top of it. This avoids "rejected" errors.
          git pull --rebase
          git push
